# Récupère les cours (Yahoo Finance, gratuit) et publie l'application sur GitHub Pages.
name: Cours et publication
on:
  push: { branches: [main] }
  workflow_dispatch:
  schedule:
    - cron: "15 */2 * * 1-5"   # toutes les 2 heures, du lundi au vendredi
    - cron: "0 12 * * 0,6"     # une fois le week-end (crypto)
permissions: { contents: read, pages: write, id-token: write }
concurrency: { group: pages, cancel-in-progress: true }
jobs:
  publier:
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: "${{ steps.deploy.outputs.page_url }}" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python scripts/recuperer_donnees.py
      - run: mkdir _site && cp -r index.html apercu.html style.css app.js sw.js manifest.webmanifest icons data _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: _site }
      - id: deploy
        uses: actions/deploy-pages@v4
