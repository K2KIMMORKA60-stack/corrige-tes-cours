<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Corrige tes cours</title>
<meta name="description" content="Qui monte et qui descend avec le pétrole, l'or, le dollar et les grands marchés.">
<meta name="theme-color" content="#0F5C6E">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Corrige tes cours">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@700;800&family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">
  <header class="top"><img src="icons/icon-192.png" alt=""><div><h1>Corrige tes cours</h1><div class="sub">Qui monte et qui descend avec le pétrole</div></div></header>
  <div id="demo" class="demo" hidden>Aperçu avec des données d'exemple. Les vrais cours arrivent une fois l'application en ligne.</div>
  <section id="moteur" class="moteur" aria-live="polite"><p class="vide">Chargement des cours…</p></section>
  <div class="ctrl"><div class="label">Référence</div><div class="chips" id="c-drv"></div></div>
  <div class="ctrl"><div class="label">Période</div><div class="chips" id="c-win"></div></div>
  <div class="tabs" role="tablist"><button class="tab" role="tab" data-tab="groupes">Avec la référence</button><button class="tab" role="tab" data-tab="familles">Familles</button></div>
  <div class="ctrl"><div class="chips" id="c-type"></div><div class="chips" id="c-reg"></div>
    <input type="search" id="q" placeholder="Chercher une action, un indice…" aria-label="Chercher"></div>
  <main id="contenu" style="display:flex;flex-direction:column;gap:12px"></main>
  <footer><span id="maj"></span><br>Outil d'information, pas un conseil d'investissement. Un lien passé ne garantit pas l'avenir.</footer>
</div>
<div id="fiche" class="fiche" hidden></div>
<script src="app.js"></script>
</body>
</html>
